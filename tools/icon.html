<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ころたま アイコン</title>
<!-- ホーム画面の アイコン（2026-10-10 案F「いまの 絵を はっきり」＝黄色の 地・大きな たまご・もよう 3つ）。
     見くらべた 6案は https://claude.ai/artifact/Y1Mo6p1eNsrm4ssimhJcvh
     headless Chrome で 192×192／512×512 に 撮る：
     chrome --headless=new --window-size=512,512 --screenshot=icon-512.png "file:///.../tools/icon.html"
     （#size=192 で 192） -->
<style>
  html, body { margin: 0; background: #f6c94f; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="ic" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#f6c94f"/>
  <ellipse cx="256" cy="540" rx="340" ry="120" fill="#8fc975"/>
  <ellipse cx="256" cy="452" rx="150" ry="40" fill="#c9a06b"/>
  <ellipse cx="256" cy="438" rx="128" ry="28" fill="#e3b98a"/>
  <g transform="translate(0 -18)">
    <path d="M256 92 C352 92 404 228 404 312 C404 404 338 462 256 462 C174 462 108 404 108 312 C108 228 160 92 256 92 Z" fill="#fffdf7"/>
    <path d="M330 120 C380 170 404 250 404 312 C404 404 338 462 256 462 C330 430 368 370 368 300 C368 230 356 170 330 120 Z" fill="#efe1c3"/>
    <circle cx="196" cy="200" r="36" fill="#7fc46a"/>
    <circle cx="300" cy="300" r="42" fill="#6f8fd6"/>
    <circle cx="196" cy="380" r="28" fill="#e8735a"/>
    <path d="M236 150 L264 176 L246 204 L280 222" fill="none" stroke="#4a3b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<script>
  const m = location.hash.match(/size=(\d+)/);
  if (m) { const s = document.getElementById('ic'); s.setAttribute('width', m[1]); s.setAttribute('height', m[1]); }
</script>
</body>
</html>
