<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>まなびたまご アイコン</title>
<!-- ホーム画面の アイコン。headless Chrome で 192×192／512×512 に 撮る：
     chrome --headless=new --window-size=512,512 --screenshot=icon-512.png "file:///.../tools/icon.html"
     （#size=192 で 192） -->
<style>
  html, body { margin: 0; background: #fbf4e4; }
  .ic { position: relative; width: 512px; height: 512px; background: #fbf4e4; overflow: hidden; transform-origin: 0 0; }
  .hill1 { position: absolute; left: -120px; top: 380px; width: 420px; height: 260px; border-radius: 50%; background: #a9cf8b; }
  .hill2 { position: absolute; left: 230px; top: 400px; width: 440px; height: 280px; border-radius: 50%; background: #8fbf74; }
  .nest1 { position: absolute; left: 116px; top: 372px; width: 280px; height: 96px; border-radius: 50%; background: #c9a06b; }
  .nest2 { position: absolute; left: 136px; top: 356px; width: 240px; height: 70px; border-radius: 50%; background: #e3b98a; }
  .egg { position: absolute; left: 156px; top: 96px; width: 200px; height: 258px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #fffdf7; box-shadow: inset -20px -14px 0 #efe3c8; overflow: hidden; }
  .egg i { position: absolute; border-radius: 50%; display: block; }
  .sun { position: absolute; left: 392px; top: 44px; width: 80px; height: 80px; border-radius: 50%; background: #f2b544; }
  .sp { position: absolute; width: 44px; height: 44px; }
</style>
</head>
<body>
<div class="ic" id="ic">
  <div class="sun"></div>
  <div class="hill1"></div><div class="hill2"></div>
  <div class="nest1"></div><div class="nest2"></div>
  <div class="egg">
    <i style="left:30px;top:56px;width:38px;height:38px;background:#8fd27a"></i>
    <i style="left:122px;top:98px;width:28px;height:28px;background:#f2c94c"></i>
    <i style="left:70px;top:156px;width:44px;height:44px;background:#6f8fd6"></i>
    <i style="left:138px;top:182px;width:22px;height:22px;background:#f0a3a0"></i>
    <i style="left:36px;top:214px;width:26px;height:26px;background:#f2c94c"></i>
    <svg style="position:absolute;left:0;top:0" width="200" height="258" viewBox="0 0 200 258" fill="none" stroke="#4a3b32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M56 86 L80 106 L68 128 L94 142"/></svg>
  </div>
  <svg class="sp" style="left:90px;top:70px" viewBox="0 0 24 24" fill="#f2b544"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>
  <svg class="sp" style="left:376px;top:150px;width:32px;height:32px" viewBox="0 0 24 24" fill="#f2b544"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>
</div>
<script>
  const m = location.hash.match(/size=(\d+)/);
  if (m) { const k = parseInt(m[1], 10) / 512; document.getElementById('ic').style.transform = 'scale(' + k + ')'; document.body.style.width = m[1] + 'px'; document.body.style.height = m[1] + 'px'; }
</script>
</body>
</html>
