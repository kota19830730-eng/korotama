<!--
  画面の 通しテストと スクリーンショット（headless Chrome）。ハッシュで モード：
    #start #setup #draw #canvas #preview #egg #home #hold[:touch|:tap|:mouse|:shot] #care #care:l #care:l:max #shop #play #play:l #done #done:grow #parent
    #flow（ごはん・おみせ・あそぶ を 自動で 答えて できた！まで）
    #kazu:<count|color>[:<add|take|hear|see>][:wrong|:count]（ねんちょう v0.1.11・wrong＝まちがえて 2回め の 声まで／count＝おさらを タッチして かぞえる）
    #kflow（ねんちょうで ごはん・おみせ を 1回ずつ まちがえて から 正解 → できた！）
    #kurabe:<s|m|l|k>[:<size|long|more|order|bignum>][:wrong]（くらべっこ v0.1.12・wrong＝2回 まちがえて 正解が 光る ところ）
    #kuflow:<s|m|l|k>（くらべっこを 1回ずつ まちがえて から 正解 → できた！）
    #moji:<s|m|l|k>[:<sound|hear|first|read|build>][:wrong|:build]（もじ v0.1.13）
    #mjflow:<s|m|l|k>（もじを まちがえて から 正解 → できた！）
    #tokei:<s|m|l|k>[:<day|next|hour|pick|read>][:wrong]（とけい v0.1.14）
    #tkflow:<s|m|l|k>（とけいを まちがえて から 正解 → できた！）
    #photo:<file URL>（本物の 写真 → --allow-file-access-from-files が いる）
  にせの 声（headless に 声は ない）・にせの 絵（かいた ように 見せた 画像）で 生きものを 作ってから 画面を 出す。
  けっかは <pre id="log">。
-->

<script>
(function () {
  const logEl = document.getElementById('log');
  const lines = [];
  let errors = 0;
  function log(s) { lines.push(String(s)); logEl.textContent = lines.join('\n'); }
  window.addEventListener('error', function (e) { errors++; log('ERROR ' + (e.message || e) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { errors++; log('REJECT ' + (e.reason && e.reason.message || e.reason)); });
  const Q = location.hash.slice(1).split(':');
  const mode = Q[0] || 'home';
  const arg = Q[1] || '';

  /* にせの 声：すぐ おわる（画面の 流れを 速く 通す） */
  const said = [];
  const fakeVoice = {
    getVoices: function () { return [{ name: 'Kyoko', lang: 'ja-JP', default: true }]; },
    cancel: function () {},
    speak: function (u) { said.push(u.text); setTimeout(function () { if (u.onend) u.onend(); }, 60); },
    addEventListener: function () {},
    Utterance: function (t) { this.text = t; }
  };
  MQ.voice.setFake(fakeVoice);
  MQ.sfx.setEnabled(false);
  window.saidLines = said;

  /* かいた ように 見せた 絵（白い 紙に 緑の 生きもの） */
  function fakeDrawing() {
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 640;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 640, 640);
    g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = '#3a3330';
    g.fillStyle = '#8fd27a'; g.beginPath(); g.ellipse(320, 340, 180, 150, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#f2c94c'; g.beginPath(); g.moveTo(200, 230); g.lineTo(190, 120); g.lineTo(260, 200); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(440, 230); g.lineTo(450, 120); g.lineTo(380, 200); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(260, 300, 34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(380, 300, 34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#222'; g.beginPath(); g.arc(266, 306, 12, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(386, 306, 12, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(280, 400); g.quadraticCurveTo(320, 440, 360, 400); g.stroke();
    g.beginPath(); g.moveTo(260, 480); g.lineTo(250, 540); g.moveTo(380, 480); g.lineTo(390, 540); g.stroke();
    return cv.toDataURL('image/png');
  }
  function withMon(stage, cb) {
    localStorage.removeItem(MQ.save.KEY);
    MQ.save._set(null);
    MQ.save.newKid({ name: 'ゆう', stage: stage || 's' });
    MQ.save.setSetting('guideSeen', Q[0] !== 'guide' && Q[0] !== 'guideflow');   // はじめての 案内は #guide だけで 出す
    const im = new Image();
    im.onload = function () {
      const t0 = performance.now();
      const res = MQ.cutout.fromImage(im, { x: 0, y: 0, w: 1, h: 1 });
      log('cutout: drawn=' + res.drawn + ' raw=' + !!(res.raw && res.raw.png) + ' soft=' + !!(res.soft && res.soft.png) + ' ms=' + Math.round(performance.now() - t0));
      if (!res.raw) { log('ERROR no png'); errors++; return; }
      const set = (Q[2] === 'raw') ? res.raw : res.soft;
      MQ.ui.makeMon(set.png, 'ぴょん', function (mon) {
        MQ.save.setMon(mon);
        const g = Number(Q[3]); if (g === 2 || g === 3) { for (let i = 0; i < (g === 2 ? 6 : 15); i++) MQ.save.update(function (d) { d.kid.stamps['2026-01-' + (10 + i)] = 1; }); }
        log('mon: png2=' + !!mon.png2 + ' png3=' + !!mon.png3 + ' growth=' + MQ.save.growth());
        cb();
      }, null, set);
    };
    im.src = fakeDrawing();
  }
  function click(el) { if (!el) { log('ERROR no element to click'); errors++; return; } el.click(); }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function finish() { log('=== エラー: ' + errors + ' ==='); log('said: ' + said.length); }

  /* v0.2：かいた ものの にせもの（たべもの＝あかい まる・ぼうし＝あおい さんかく・ともだち＝ピンクの まる・おにわ＝きいろい はな） */
  function fakePng(kind, cb) {
    const cv = document.createElement('canvas'); cv.width = 200; cv.height = 200; const g = cv.getContext('2d');
    g.lineWidth = 8; g.strokeStyle = '#3a3330';
    if (kind === 'hat') { g.fillStyle = '#4f7fd9'; g.beginPath(); g.moveTo(100, 20); g.lineTo(170, 150); g.lineTo(30, 150); g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#f2c94c'; g.fillRect(20, 150, 160, 24); g.strokeRect(20, 150, 160, 24); }
    else if (kind === 'friend') { g.fillStyle = '#f08cb0'; g.beginPath(); g.ellipse(100, 110, 70, 64, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.arc(78, 100, 14, 0, 7); g.arc(122, 100, 14, 0, 7); g.fill(); g.fillStyle = '#222'; g.beginPath(); g.arc(80, 102, 6, 0, 7); g.arc(124, 102, 6, 0, 7); g.fill(); }
    else if (kind === 'garden') { g.fillStyle = '#6cc24a'; g.fillRect(94, 100, 12, 90); g.fillStyle = '#f2c94c'; for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(100 + Math.cos(i) * 40, 70 + Math.sin(i) * 40, 24, 0, 7); g.fill(); } g.fillStyle = '#e0493a'; g.beginPath(); g.arc(100, 70, 22, 0, 7); g.fill(); }
    else { g.fillStyle = '#e0493a'; g.beginPath(); g.arc(100, 110, 70, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#6cc24a'; g.fillRect(96, 20, 14, 30); }
    cb(cv.toDataURL('image/png'));
  }
  function fakeItems(cb) {
    fakePng('food', function (f) { fakePng('hat', function (hh) { fakePng('friend', function (fr) { fakePng('garden', function (gd) {
      MQ.save.update(function (d) { const it = d.kid.items; it.foods = [{ png: f, at: Date.now() - 5e6 }]; it.hat = { png: hh, at: Date.now() - 4e6 }; it.friend = { png: fr, at: Date.now() - 3e6 }; it.garden = [{ png: gd, at: Date.now() - 2e6 }, { png: f, at: Date.now() - 1e6 }]; d.kid.finds = [{ png: f, what: 'あかい もの', at: Date.now() }]; });
      cb();
    }); }); }); });
  }
  MQ.stage.fit();
  const run = {
    start: function () { localStorage.removeItem(MQ.save.KEY); MQ.save._set(null); MQ.ui.start.open(); finish(); },
    setup: function () { localStorage.removeItem(MQ.save.KEY); MQ.save._set(null); MQ.ui.setup.open(); finish(); },
    draw: function () { MQ.save.newKid({ name: 'ゆう', stage: 's' }); MQ.ui.draw.open(); finish(); },
    pmon: function () { localStorage.removeItem(MQ.save.KEY); MQ.save._set(null); MQ.save.newKid({ name: 'ゆう', stage: 's' }); const pz = MQ.presets.get(arg || 'dragon'); MQ.ui.makeMon(pz.png, pz.name, function (mon) { MQ.save.setMon(mon); const g = Number(Q[2]); if (g === 2 || g === 3) { const need = g === 2 ? 6 : 15; for (let i = 0; i < need; i++) MQ.save.update(function (d) { d.kid.stamps['2026-01-' + (10 + i)] = 1; }); } if (Q[2] === 'egg') MQ.ui.egg.open(); else MQ.ui.home.open(); log('pmon: ' + pz.id + ' svg=' + (mon.png.indexOf('data:image/svg') === 0) + ' png2=' + !!mon.png2 + ' png3=' + !!mon.png3 + ' growth=' + MQ.save.growth() + ' shown=' + (MQ.save.monPng() === (MQ.save.growth() === 3 ? mon.png3 : MQ.save.growth() === 2 ? mon.png2 : mon.png))); setTimeout(finish, 400); }, pz); },
    zunda: function () {   // 録音した 声：bank を 読んで 1文 鳴らす（--allow-file-access-from-files --autoplay-policy=no-user-gesture-required）
      MQ.save.newKid({ name: 'ゆう', stage: 's' });
      let n = 0;
      const tick = function () {
        if (!MQ.voice.hasBank() && n++ < 40) { setTimeout(tick, 250); return; }
        MQ.voice.setKind('zunda'); MQ.voice.setNames(['ゆう']);
        MQ.voice.preload('おはよう！', function (dur) {
          log('zunda: bank=' + MQ.voice.hasBank() + ' clip=' + MQ.voice.clipFor('おはよう！') + ' decoded sec=' + dur.toFixed(2) + ' strip=' + MQ.voice.stripNames('ゆうちゃん、おはよう！'));
          if (!(dur > 0.3)) { log('ERROR clip not decoded'); errors++; }
          const ok = MQ.voice.say('ゆうちゃん、おはよう！ きょうは なにを する？');
          log('zunda say=' + ok + ' kind=' + MQ.voice.kind());
          finish();
        });
      };
      tick();
    },
    presets: function () { MQ.save.newKid({ name: 'ゆう', stage: 's' }); MQ.ui.draw.openPresets(arg || 'cute'); const n = MQ.presets.list(arg || 'cute').filter(function (p) { return p.png; }).length; log('presets ' + (arg || 'cute') + ': png=' + n); if (Q[2] === 'pick') { click($('#screen-draw .ptile')); } finish(); },
    canvas: function () { MQ.save.newKid({ name: 'ゆう', stage: 's' }); MQ.ui.draw.openCanvas(); finish(); },
    preview: function () {
      MQ.save.newKid({ name: 'ゆう', stage: 's' });
      const im = new Image(); im.onload = function () { MQ.ui.draw.fromImage(im, false); finish(); }; im.src = fakeDrawing();
    },
    egg: function () { withMon('s', function () { MQ.ui.egg.open(); if (arg === 'hatch') { setTimeout(function () { const b = $('#screen-egg .item'); click(b); click(b); click(b); setTimeout(finish, 1800); }, 400); } else finish(); }); },
    home: function () { withMon(arg || 's', function () { if (Q[2] === 'helped') MQ.save.update(function (d) { d.kid.help[MQ.save.today()] = 'shoes'; }); MQ.ui.home.open(); setTimeout(function () { const L = MQ.ui.home._t.letter, r = L.getBoundingClientRect(); log('letter: ' + L.getAttribute('aria-label') + ' ' + Math.round(r.width) + 'x' + Math.round(r.height)); finish(); }, 400); }); },   // #home[:段階[:helped]]（helped＝きょうの おてつだい ずみ＝ポストに はなまる）
    // 鍵の 長おし（v0.1.18）：touch＝touchstart→1.6秒→touchend で おうちの人の 画面／tap＝短く はなす→トースト／mouse＝pointer（マウス）／shot＝押して いる 途中を 撮る
    hold: function () { withMon('s', function () { MQ.ui.home.open(); setTimeout(function () {
      const b = $('#screen-home .rbtn--lock');
      if (!b) { log('ERROR no lock button'); errors++; finish(); return; }
      function te(type) { try { return new TouchEvent(type, { bubbles: true, cancelable: true, touches: type === 'touchend' ? [] : [new Touch({ identifier: 1, target: b, clientX: 10, clientY: 10 })] }); } catch (e) { return new Event(type, { bubbles: true, cancelable: true }); } }
      if (arg === 'shot') { b.classList.add('is-hold'); b.style.setProperty('--p', '60%'); b.querySelector && (b.style.animation = 'none'); log('hold shot'); finish(); return; }
      if (arg === 'mouse') { b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse', pointerId: 1 })); setTimeout(function () { log('hold mouse: parent=' + $('#screen-parent').classList.contains('is-active') + ' hold-class=' + b.classList.contains('is-hold')); finish(); }, 1700); return; }
      if (arg === 'tap') { b.dispatchEvent(te('touchstart')); setTimeout(function () { b.dispatchEvent(te('touchend')); setTimeout(function () { log('hold tap: parent=' + $('#screen-parent').classList.contains('is-active') + ' toast=' + ($('#toast') && $('#toast').classList.contains('is-on') ? $('#toast').textContent : 'なし')); finish(); }, 50); }, 120); return; }
      b.dispatchEvent(te('touchstart'));
      // iPad の まね：とちゅうで pointercancel が 来ても 止まらない
      setTimeout(function () { b.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, pointerType: 'touch', pointerId: 1 })); }, 500);
      setTimeout(function () { const holding = b.classList.contains('is-hold'); b.dispatchEvent(te('touchend')); setTimeout(function () { log('hold touch: holding-at-1.2s=' + holding + ' parent=' + $('#screen-parent').classList.contains('is-active')); finish(); }, 50); }, 1700);
    }, 400); }); },
    /* タップの 反応（v0.1.16）：#react:<name>[:night][:<stamps>]
       name＝happy|jump|spin|shy|yawn|tickle|pat|sleep|wake|look（キャラクター）／sun|moon|cloud|rainbow|tree|bird|house|hill|butterfly|sky（背景）／decor（かざりだけ）／none
       night＝夜に する・stamps＝スタンプの 合計（かざり）。写真は 反応の とちゅうで 止めて 撮る（freeze） */
    react: function () {
      withMon('s', function () {
        const night = Q[2] === 'night' || Q[3] === 'night';
        const total = Number(Q[2]) || Number(Q[3]) || 0;
        for (let i = 0; i < total; i++) MQ.save.update(function (d) { d.kid.stamps['2026-02-' + ('0' + (1 + i % 28)).slice(-2)] = (d.kid.stamps['2026-02-' + ('0' + (1 + i % 28)).slice(-2)] || 0) + 1; });
        MQ.ui.home.open({ night: night });
        const T = MQ.ui.home._t, sc = T.scene;
        log('home: night=' + sc.night + ' live=' + sc.classList.contains('is-live') + ' taps=' + Object.keys(sc.taps).join(',') + ' decor=' + JSON.stringify(sc.decorCount) + ' want=' + JSON.stringify(MQ.ui.decorOf(MQ.save.stampsTotal())));
        setTimeout(function () {
          const name = arg || 'none';
          // 反応の とちゅうで 止めて 撮る：ここから 先の setTimeout を おぼえて、撮る ときに ぜんぶ 消す（消す タイマーで 絵が もどる ため）
          const ids = [], st0 = window.setTimeout; window.setTimeout = function (f, ms) { const id = st0(f, ms); ids.push(id); return id; };
          const kinds = { happy: 1, jump: 1, spin: 1, shy: 1, yawn: 1, tickle: 1, pat: 1, wake: 1, look: 1 };
          if (kinds[name]) { if (name === 'wake') T.sleep(); T.react(name); }
          else if (name === 'sleep') T.sleep();
          else if (name === 'idle') { MQ.ui.home.IDLE.look = 30; MQ.ui.home.IDLE.yawn = 60; MQ.ui.home.IDLE.sleep = 90; T.idle(); }
          else if (name === 'tap3') { T.onTap(); T.onTap(); T.onTap(); }
          else if (name === 'rainbow') { sc.react('cloud'); sc.react('cloud'); sc.react('cloud'); }
          else if (name === 'bird') { sc.react('tree'); sc.react('tree'); }
          else if (name === 'butterfly') { sc.react('hill', 150, 200); sc.react('hill', 120, 230); }
          else if (name === 'tapbtn') { click(sc.taps.sun); click(sc.taps.cloud); click(sc.taps.tree); click(sc.taps.house); }
          else if (name !== 'none' && name !== 'decor') sc.react(name, name === 'hill' ? 140 : undefined, name === 'hill' ? 210 : undefined);
          const ms = Number(Q[4]) || (name === 'rainbow' ? 1400 : name === 'idle' ? 140 : 450);
          setTimeout(function () {
            log('react ' + name + ': mon=' + T.mon.className + ' fx=' + sc.fx.children.length + ' flowers=' + sc.querySelectorAll('.flower').length + ' butterflies=' + sc.querySelectorAll('.butterfly').length + ' flag=' + !!sc.querySelector('.scene__flag') + ' zz=' + sc.querySelectorAll('.mon__zz').length + ' hearts=' + sc.querySelectorAll('.heart').length + ' rainbow=' + !!sc.querySelector('.rainbow') + ' bird=' + !!sc.querySelector('.bird') + ' win=' + sc.parts.win.classList.contains('is-on') + ' counts=' + JSON.stringify(sc.counts) + ' said=' + said.slice(-2).join(' / '));
            // 止めて 撮る
            ids.forEach(function (id) { clearTimeout(id); }); window.setTimeout = st0;
            // virtual-time では animation の 時計が 進まない（0% の 絵に なる）→ 止めたい 時間を マイナスの delay で 入れて 止める
            const at = (ms / 1000).toFixed(2);
            [sc, T.mon].forEach(function (root) { Array.prototype.slice.call(root.querySelectorAll('*')).concat([root]).forEach(function (el) { try { const an = getComputedStyle(el).animationName; if (an && an !== 'none') { el.style.animationDelay = '-' + at + 's'; el.style.animationPlayState = 'paused'; } } catch (e) { /* なし */ } }); });
            finish();
          }, ms);
        }, 320);

      im.onload = function () {
        const res = MQ.cutout.fromImage(im, { x: 0, y: 0, w: 1, h: 1 });
        const out = document.createElement('canvas'); out.width = 256; out.height = 256;
        const show = function (src, x) { return new Promise(function (r) { const i2 = new Image(); i2.onload = function () { const o = document.createElement('canvas'); o.width = i2.width; o.height = i2.height; const og = o.getContext('2d'); og.drawImage(i2, 0, 0); r({ img: i2, ctx: og, w: i2.width, h: i2.height }); }; i2.src = src; }); };
        show(res.raw.png).then(function (R) {
          // 色ごとの 線の 高さで 横に しらべ、すきとおって いない 点が あるか
          const d = R.ctx.getImageData(0, 0, R.w, R.h).data;
          // まんなかの 列を 上から 見て、絵の ある 帯（＝線）が いくつ あるか（15本 あれば どの 色も のこった）
          let bands = 0, inb = false; const cx = Math.round(R.w / 2);
          for (let y = 0; y < R.h; y++) { const on = d[(y * R.w + cx) * 4 + 3] > 120; if (on && !inb) bands++; inb = on; }
          const miss = bands === MQ.ui.CRAYONS.length ? [] : ['bands=' + bands];
          log('crayons: drawn=' + res.drawn + ' colors=' + MQ.ui.CRAYONS.length + ' missing=' + (miss.join(',') || 'none'));
          const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:0;top:0;background:#cbb;padding:8px;display:flex;gap:8px;z-index:50';
          [cv.toDataURL(), res.raw.png, res.soft.png].forEach(function (src) { const e = document.createElement('img'); e.src = src; e.style.cssText = 'width:240px;height:240px;object-fit:contain;background:#fff'; box.appendChild(e); });
          document.body.appendChild(box);
          finish();
        });
      };
      im.src = cv.toDataURL('image/png');
    },
    /* #guide[:<ページ 0〜4>]（はじめての 案内・2026-10-10）／#guideflow（さいごまで つぎへ → とじると あいさつ・ゆび）／#setupbd（はじめの 設定の 誕生日） */
    guide: function () { withMon('s', function () { MQ.ui.home.open(); setTimeout(function () { const n = Number(arg) || 0; if (n) { MQ.ui.guide.close(true); MQ.ui.guide.open({ page: n }); } log('guide: open=' + MQ.ui.guide.isOpen() + ' page=' + MQ.ui.guide._i + ' pages=' + MQ.ui.guide.PAGES.length); finish(); }, 600); }); },
    guideflow: function () { withMon('s', async function () { MQ.ui.home.open(); await wait(600); log('open=' + MQ.ui.guide.isOpen()); for (let k = 0; k < MQ.ui.guide.pages().length - 1; k++) { click($$('.gd__nav .btn--gold')[0]); await wait(100); } log('page=' + MQ.ui.guide._i); click($$('.gd__end .btn--gold')[0]); await wait(800); log('closed=' + !MQ.ui.guide.isOpen() + ' seen=' + MQ.save.settings().guideSeen + ' finger=' + !!$('#screen-home .finger--home')); MQ.ui.home.open(); await wait(600); log('again open=' + MQ.ui.guide.isOpen()); finish(); }); },
    /* #fbask[:sent|:shot]（感想フォームの お願い）／#fbguide（案内の 6ページめ）／#fbparent（おうちの人の 画面の カード）。url は テスト用の にせ */
    fbask: function () { withMon('s', async function () {
      MQ.ui.feedback.FORM.url = 'https://docs.google.com/forms/d/e/TEST/viewform';
      const day = function (n) { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      MQ.save.update(function (d) { d.kid.stamps = {}; d.kid.stamps[day(0)] = 1; });
      MQ.ui.home.open(); await wait(700);
      log('1日だけ: ' + (MQ.ui.feedback.isOpen() ? '出た NG' : '出ない OK'));
      MQ.save.update(function (d) { d.kid.stamps[day(1)] = 2; });
      MQ.ui.home.open(); await wait(700);
      log('2日め: ' + (MQ.ui.feedback.isOpen() ? '出た OK' : 'NG'));
      if (arg === 'shot') { finish(); return; }
      if (arg === 'sent') { click($$('.fb .gd__end .btn')[1]); await wait(300); log('送りました fbDone=' + MQ.save.settings().fbDone); MQ.save.setSetting('fbAskDay', ''); MQ.ui.home.open(); await wait(700); log('送った あと: ' + (MQ.ui.feedback.isOpen() ? '出た NG' : '出ない OK')); finish(); return; }
      click($('.fb__later')); await wait(400);
      MQ.ui.home.open(); await wait(700);
      log('同じ日: ' + (MQ.ui.feedback.isOpen() ? '出た NG' : '出ない OK'));
      MQ.save.setSetting('fbAskDay', '2000-1-1'); MQ.ui.home.open(); await wait(700);
      log('つぎの日: ' + (MQ.ui.feedback.isOpen() ? '出た OK' : 'NG'));
      finish(); }); },
    fbguide: function () { withMon('s', function () { MQ.ui.feedback.FORM.url = 'https://docs.google.com/forms/d/e/TEST/viewform'; MQ.save.setSetting('guideSeen', false); MQ.ui.home.open(); setTimeout(function () { MQ.ui.guide.close(true); MQ.ui.guide.open({ page: 5 }); log('pages=' + MQ.ui.guide.pages().length + ' (6 が 正) title=' + ($('.gd__title') || {}).textContent); finish(); }, 600); }); },
    fbparent: function () { withMon('s', function () { MQ.ui.feedback.FORM.url = 'https://docs.google.com/forms/d/e/TEST/viewform'; MQ.ui.parent.open(); setTimeout(function () { const c = $$('#screen-parent .card__title').filter(function (e) { return e.textContent.indexOf('感想') >= 0; })[0]; log('parent card=' + !!c); if (c) c.scrollIntoView(); finish(); }, 300); }); },
    setupbd: function () { localStorage.removeItem(MQ.save.KEY); MQ.save._set(null); MQ.ui.setup.open(); const s = $$('#screen-setup select'); s[0].value = '05'; s[1].value = '03'; click($$('#screen-setup .btn--gold')[0]); log('birthday=' + MQ.save.kid().birthday + ' screen=' + MQ.ui.current); const b = $('#screen-setup .page__body'); if (b) b.scrollTop = 9999; finish(); },
    flow: function () {
      withMon(arg || 's', async function () {
        MQ.ui.home.open(); await wait(200);
        // おうち：背景と キャラクターを たたく（v0.1.16）
        (function () { const T = MQ.ui.home._t; click(T.scene.taps.sun); click(T.scene.taps.cloud); click(T.scene.taps.tree); click(T.scene.taps.house); T.scene.react('hill', 140, 210); T.onTap(); T.onTap(); T.onTap(); log('home taps: counts=' + JSON.stringify(T.scene.counts) + ' mon=' + T.mon.className + ' fx=' + T.scene.fx.children.length); })();
        await wait(100);
        // ごはん：3回 正解
        click($('#screen-home .big--gold')); await wait(300);
        click($('#screen-care .mon')); log('care mon tap (C): ' + $('#screen-care .mon').className);
        for (let r = 0; r < 3; r++) {
          const st = MQ.ui.care.state();
          const n = st.task.n;
          const wrongB = $$('#screen-care .basket .item').filter(function (x) { return x.getAttribute('aria-label') !== st.task.food.name; })[0];
          if (r === 0) { click(wrongB); await wait(30); log('care wrong tap placed=' + MQ.ui.care.state().placed); }
          for (let i = 0; i < n; i++) { click($$('#screen-care .basket .item').filter(function (x) { return x.getAttribute('aria-label') === st.task.food.name; })[0]); await wait(30); }
          if (!st.task.slots) click($('#screen-care .mon'));
          await wait(300);
          log('care r' + r + ' ok=' + (MQ.ui.care.state().round === r + 1 || MQ.ui.current === 'screen-done'));
        }
        await wait(200);
        log('after care: ' + MQ.ui.current + ' stamps=' + MQ.save.stampsToday());
        click($('#screen-done .btn--gold')); await wait(200);
        // おみせ：わざと ちがう 色を 1回 → 正しい 色を n 回
        click($('#screen-home .big--clay')); await wait(300);
        for (let r = 0; r < 3; r++) {
          const st = MQ.ui.shop.state();
          const wrong = $$('#screen-shop .shelf .item').filter(function (x) { return x.getAttribute('aria-label').indexOf(st.task.want.say) !== 0; })[0];
          if (wrong) { click(wrong); await wait(100); }
          for (let i = 0; i < st.task.n; i++) {
            const ok = $$('#screen-shop .shelf .item').filter(function (x) { return x.getAttribute('aria-label').indexOf(st.task.want.say) === 0; })[0];
            click(ok); await wait(40);
          }
          await wait(300);
          log('shop r' + r + ' ok=' + (MQ.ui.shop.state().round === r + 1 || MQ.ui.current === 'screen-done'));
        }
        await wait(200);
        log('after shop: ' + MQ.ui.current + ' stamps=' + MQ.save.stampsToday());
        click($('#screen-done .btn--gold')); await wait(200);
        // あそぶ：まちがい 1回 → 正解
        click($('#screen-home .big--green')); await wait(300);
        for (let r = 0; r < 3; r++) {
          const wrong = $$('#screen-play .toy').filter(function (x, i) { return !MQ.ui.play.state().task.options[i].ok; })[0];
          if (wrong) { click(wrong); await wait(100); }
          const ok = $$('#screen-play .toy').filter(function (x, i) { return MQ.ui.play.state().task.options[i].ok; })[0];
          click(ok); await wait(300);
          log('play r' + r + ' ok=' + (MQ.ui.play.state().round === r + 1 || MQ.ui.current === 'screen-done'));
        }
        await wait(200);
        log('after play: ' + MQ.ui.current + ' stamps=' + MQ.save.stampsToday() + ' done=' + JSON.stringify(MQ.save.kid().done));
        // おうちの人 → もどる
        click($('#screen-done .btn--gold')); await wait(100);
        MQ.ui.parent.open(); await wait(100);
        click($('#screen-parent .btn')); await wait(100);
        log('end: ' + MQ.ui.current);
        finish();
      });
    }
  };
  (run[mode] || run.home)();
})();
</script>
